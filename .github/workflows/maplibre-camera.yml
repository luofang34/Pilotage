name: maplibre camera

# The world-model camera links a GPU renderer the workspace does not
# build, so it has its own job. It runs only when its sources change or
# when started by hand. Its render tests need a GPU; the macOS runner
# has Metal.
on:
  pull_request:
    paths:
      - "sim/maplibre-camera/**"
      - "adapters/sim-video/**"
      - "crates/pilotage-camera-calibration/**"
      - "crates/pilotage-calibration-id/**"
      - "schemas/pilotage/bridge/**"
      - ".github/workflows/maplibre-camera.yml"
  workflow_dispatch:

concurrency:
  group: maplibre-camera-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "26.1"
  PROTOC_OSX_SHA256: 26a29befa8891ecc48809958c909d284f2b9539a2eb47f22cadc631fe6abe8fd

jobs:
  maplibre-camera:
    runs-on: macos-15
    defaults:
      run:
        working-directory: sim/maplibre-camera
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protoc
        run: |
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/protoc"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-aarch_64.zip" \
            --output "${archive}"
          echo "${PROTOC_OSX_SHA256}  ${archive}" | shasum -a 256 --check --strict
          unzip -q "${archive}" -d "${install_dir}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/protoc" --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim/maplibre-camera

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D missing_docs -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps

      - name: cargo build --release
        run: cargo build --release
