# Engineering trace gate (ASSURE-01, issue 77; ASSURE-04, issue 133).
#
# The trace VERDICT is advisory: a review may honestly stay PENDING, and a
# pending review must never block a merge, so the verdict steps stay
# `continue-on-error`. It is NOT a certification, compliance, or tool
# qualification result (SIM / NOT FOR FLIGHT).
#
# Baseline RESOLVABILITY is NOT advisory. The "baselines MUST be reachable
# and resolvable (HARD)" steps carry no `continue-on-error`, so a broken or
# orphaned baseline — a declared SCM commit unreachable from HEAD, a
# missing selector, or a missing artifact — reddens this job. Durable
# evidence resolution is enforced; the review verdict is not.
#
# The gate tool itself lives upstream (indicate-evidence in the Indicate
# repository, pinned below at the same rev the workspace pins); its own
# tests and negative-fixture batteries run in that repository's CI. The
# instruments evidence graph travels with the panels and is gated there
# too; the graphs here are the ones whose sources live in this tree.
name: Evidence trace gate

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Navigate is a private git dependency; the git CLI can use the
  # runner's rewritten ssh credentials, libgit2 cannot.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  evidence-trace-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Baseline membership verification resolves declared configuration
          # commits against real history; a shallow clone would make every
          # recorded baseline unverifiable.
          fetch-depth: 0

      - name: Authorize the private git dependency (Navigate)
        env:
          NAVIGATE_DEPLOY_KEY: ${{ secrets.NAVIGATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NAVIGATE_DEPLOY_KEY" > ~/.ssh/navigate_ci
          chmod 600 ~/.ssh/navigate_ci
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # A read-only deploy key, bound by GitHub to the one repository
          # whose key it is, offered through a dedicated host alias.
          # Indicate is public and needs no credential.
          printf 'Host github-navigate\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/navigate_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-navigate/luofang34/Navigate".insteadOf "https://github.com/luofang34/Navigate"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install the pinned evidence gate
        # The rev here is the same Indicate pin the workspace manifest
        # carries, so the gate that judges these graphs is the one the
        # family's own CI tests. --force: the restored cargo cache may
        # hold an evidence-gate binary owned by a different crate name
        # or rev, and a stale gate must be overwritten, never kept.
        run: >
          cargo install --locked --force
          --git https://github.com/luofang34/Indicate.git
          --rev 14e9a7591a8a659b71d4a19e027c07b7448d6bcb
          indicate-evidence

      - name: LINK-04 slice — honest verdict and bidirectional trace
        # Informational. The source-role slice is structurally traced and
        # resolves both ways; its review node records a PENDING review slot.
        # The hard guard is the Rust suites its results record, which run in
        # the required quality gates.
        continue-on-error: true
        run: >
          evidence-gate
          --graph docs/link/evidence-graph.evg --repo-root . --trace

      - name: CTRL-01 slice — honest verdict and bidirectional trace
        # Informational. The typed control-authority slice is structurally
        # traced and resolves both ways; its review node records a PENDING
        # review slot. The hard guard is the Rust suites its results record,
        # which run in the required quality gates.
        continue-on-error: true
        run: >
          evidence-gate
          --graph docs/control/evidence-graph.evg --repo-root . --trace

      - name: CTRL-01 slice — resolve selectors against the tree
        continue-on-error: true
        run: >
          evidence-gate
          --graph docs/control/evidence-graph.evg --repo-root .
          --resolve-selectors

      - name: CTRL-01 slice — baselines MUST be reachable and resolvable (HARD)
        # NOT advisory (no continue-on-error): every recorded result must
        # resolve — its declared SCM baseline reachable from HEAD, its
        # selectors and artifacts present (ASSURE-04).
        run: >
          evidence-gate
          --graph docs/control/evidence-graph.evg --repo-root .
          --require-resolvable

      - name: LINK-04 slice — resolve selectors against the tree
        continue-on-error: true
        run: >
          evidence-gate
          --graph docs/link/evidence-graph.evg --repo-root .
          --resolve-selectors

      - name: LINK-04 slice — baselines MUST be reachable and resolvable (HARD)
        # NOT advisory (no continue-on-error). The review verdict may stay
        # PENDING, but every recorded result must resolve: its declared SCM
        # baseline reachable from HEAD (not a force-push orphan), and its
        # selectors and artifacts present. A broken or orphaned baseline
        # reddens this job (ASSURE-04, issue 133). Needs full history
        # (fetch-depth: 0 above) so reachability is decidable.
        run: >
          evidence-gate
          --graph docs/link/evidence-graph.evg --repo-root .
          --require-resolvable
