name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The Navigate crates are private git dependencies; libgit2
  # cannot use the runner's rewritten ssh credentials, the git CLI can.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PROTOC_SHA256: a7be2928c0454f132c599e25b79b7ad1b57663f2337d7f7e468a1d59b98ec1b0
  PROTOC_VERSION: "26.1"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # buf breaking compares the working tree against the base ref, so the
          # base commit must be present locally; a shallow clone would hide it.
          fetch-depth: 0

      - name: Authorize the private git dependency (Navigate)
        env:
          NAVIGATE_DEPLOY_KEY: ${{ secrets.NAVIGATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NAVIGATE_DEPLOY_KEY" > ~/.ssh/navigate_ci
          chmod 600 ~/.ssh/navigate_ci
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # A read-only deploy key, bound by GitHub to the one repository
          # whose key it is, offered through a dedicated host alias.
          # Indicate is public and needs no credential.
          printf 'Host github-navigate\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/navigate_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-navigate/luofang34/Navigate".insteadOf "https://github.com/luofang34/Navigate"

      - name: Authorize the private situation domain dependencies
        env:
          AIRMASS_DEPLOY_KEY: ${{ secrets.AIRMASS_DEPLOY_KEY }}
          SURVEILLANCE_DEPLOY_KEY: ${{ secrets.SURVEILLANCE_DEPLOY_KEY }}
        run: |
          if [ -z "$AIRMASS_DEPLOY_KEY" ] || [ -z "$SURVEILLANCE_DEPLOY_KEY" ]; then
            echo "::error::AIRMASS_DEPLOY_KEY and SURVEILLANCE_DEPLOY_KEY must contain private deploy keys." >&2
            exit 1
          fi
          printf '%s\n' "$AIRMASS_DEPLOY_KEY" > ~/.ssh/airmass_ci
          printf '%s\n' "$SURVEILLANCE_DEPLOY_KEY" > ~/.ssh/surveillance_ci
          chmod 600 ~/.ssh/airmass_ci ~/.ssh/surveillance_ci
          printf 'Host github-airmass\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/airmass_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          printf 'Host github-surveillance\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/surveillance_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-airmass/luofang34/Airmass".insteadOf "https://github.com/luofang34/Airmass"
          git config --global url."ssh://git@github-surveillance/luofang34/Surveillance".insteadOf "https://github.com/luofang34/Surveillance"

      - name: Install system dependencies (hidapi on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown

      - name: Install protoc
        run: |
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/protoc"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            --output "${archive}"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${install_dir}"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/protoc" --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Production Rust lint guard self-test
        run: sh scripts/test-check-production-rust-lints.sh

      - name: Production Rust lint guard
        run: sh scripts/check-production-rust-lints.sh

      - name: Monotonic counter arithmetic guard self-test
        run: bash scripts/test-check-monotonic-counter-arithmetic.sh

      - name: Monotonic counter arithmetic guard
        run: bash scripts/check-monotonic-counter-arithmetic.sh

      - name: Aviate control-feel boundary guard self-test
        run: bash scripts/test-check-aviate-control-feel-boundary.sh

      - name: Aviate control-feel boundary guard
        run: bash scripts/check-aviate-control-feel-boundary.sh

      - name: flight-tune journal storage boundary self-test
        run: bash scripts/test-check-flight-tune-journal-storage-boundary.sh

      - name: flight-tune journal storage boundary
        run: bash scripts/check-flight-tune-journal-storage-boundary.sh

      - name: cargo test
        run: cargo test --all-targets

      - name: durable storage non-Unix contract and consumer
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p pilotage-durable-storage --tests --target wasm32-unknown-unknown
          cargo check -p flight-tune --target wasm32-unknown-unknown

      - name: SituationView conformance corpus
        run: cargo test -p pilotage-situation-view --test corpus

      - name: SituationView dependency boundary
        run: bash scripts/check-situation-view-boundary.sh

      - name: AirspaceView contract self-test
        run: bash scripts/test-check-airspace-view-contract.sh

      - name: AirspaceView contract
        run: bash scripts/check-airspace-view-contract.sh

      - name: Navdata tile bundle guard self-test
        run: bash scripts/test-check-navdata-tile-bundle.sh

      - name: Navdata tile bundle guard
        run: bash scripts/check-navdata-tile-bundle.sh

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D missing_docs -D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps

      - name: cargo build --release
        run: cargo build --release

      - name: X-Plane weather transaction state
        run: bash scripts/check-xplane-weather-state.sh

      - name: X-Plane weather clear protocol
        run: python3 scripts/test-xplane-weather-clear.py

      - name: X-Plane reset order
        run: bash scripts/test-reset-xplane-order.sh

      - name: flight build carries no simulation-only code
        run: bash scripts/check-flight-build.sh

      - name: flight tuning boundary guard self-test
        run: bash scripts/test-check-flight-tune-boundaries.sh

      - name: flight tuning boundary guard
        run: bash scripts/check-flight-tune-boundaries.sh

      - name: check-structure self-test
        run: bash scripts/test-check-structure.sh

      - name: check-structure
        run: bash scripts/check-structure.sh

      - name: situation presentation boundary self-test
        run: bash scripts/test-check-situation-presentation-boundary.sh

      - name: situation presentation boundary
        run: bash scripts/check-situation-presentation-boundary.sh

      - name: situation layer controls self-test
        run: bash scripts/test-check-situation-layer-controls.sh

      - name: situation layer controls
        run: bash scripts/check-situation-layer-controls.sh

      - name: situation map attribution self-test
        run: bash scripts/test-check-situation-map-attribution.sh

      - name: situation map attribution
        run: bash scripts/check-situation-map-attribution.sh

      - name: situation ownship wiring self-test
        run: bash scripts/test-check-situation-ownship-wiring.sh

      - name: situation ownship wiring
        run: bash scripts/check-situation-ownship-wiring.sh

      - name: Apple client guard self-test
        run: bash scripts/test-check-apple-client.sh

      - name: Apple client guard
        run: bash scripts/check-apple-client.sh

      - name: Terrain base layer guard self-test
        run: bash scripts/test-check-terrain-base-layer.sh

      - name: Terrain base layer guard
        run: bash scripts/check-terrain-base-layer.sh

      - name: Geodetic datum code guard self-test
        run: bash scripts/test-check-geodetic-datum-codes.sh

      - name: Geodetic datum code bijection
        run: bash scripts/check-geodetic-datum-codes.sh

      - name: ADR supersession lifecycle tests
        run: bash scripts/test-check-adr-supersession.sh

      - name: ADR supersession lifecycle
        run: bash scripts/check-adr-supersession.sh

      - name: certification-claim guard (AIR-03)
        # Fail on any tracked doc/UI artifact that asserts a certification,
        # compliance, approval, or airworthiness claim about this SIM project.
        run: bash scripts/check-certification-claims.sh

      - name: remaining sans-IO crates are no_std (ADR-0017)
        run: >
          cargo check
          -p pilotage-geo
          -p pilotage-ingress
          --target thumbv7em-none-eabihf

      - name: the instrument shell is protocol-free (ADR-0034)
        # The wasm bundle splits on the protocol dependency: the instrument
        # half must never grow one, or the extraction cut line closes.
        run: |
          tree=$(cargo tree -p pilotage-instruments-web-shell -e normal)
          if grep -q "pilotage-protocol" <<<"$tree"; then
            echo "pilotage-instruments-web-shell depends on pilotage-protocol"; exit 1
          fi

      - name: the instrument runtime is platform-neutral (ADR-0032)
        # The portable instrument runtime must never link a platform
        # binding or the protocol: the shells are thin adapters, and a
        # forbidden dependency here closes the ADR-0032 cut line.
        run: |
          tree=$(cargo tree -p pilotage-instrument-runtime -e normal)
          for forbidden in wasm-bindgen serde-wasm-bindgen pilotage-protocol; do
            if grep -q "$forbidden" <<<"$tree"; then
              echo "pilotage-instrument-runtime depends on $forbidden"; exit 1
            fi
          done

      - name: Indicate compatibility identity
        run: bash scripts/check-indicate-compatibility.sh

      - name: companion host excludes Apple bridge dependencies
        run: |
          tree=$(cargo tree -p pilotage-session-host -e normal)
          for forbidden in pilotage-instrument-apple-bridge uniffi; do
            if grep -q "$forbidden" <<<"$tree"; then
              echo "pilotage-session-host depends on $forbidden"; exit 1
            fi
          done

      - name: geospatial contract (SVS-01)
        # Datum discipline, coherence, view/projection, availability, and the
        # fail-closed versioned ABI for synthetic vision and conformal HUD.
        run: cargo test -p pilotage-geo

      - name: database package integrity (SVS-02)
        # Signed, provenance-preserving, atomically activated aeronautical
        # database packages: one-byte mutation fails tile/package verification,
        # interrupted update yields the prior package or none, and trust-root,
        # rollback, expiry, coverage, and datum rules fail closed.
        run: cargo test -p pilotage-svs-db

      - name: instrument wasm backend builds
        # Generating the resource binding here makes the fail-visible test
        # exercise the exact WASM artifact served by the browser client.
        run: bash scripts/build-web-instruments.sh

      - name: web viewer wire conformance
        run: node clients/web/wire.test.mjs

      - name: telemetry ingress gate contract
        run: node clients/web/telemetry-ingress.test.mjs

      - name: navigation display profile (ADR-0031 deviation scaling and signs)
        run: node clients/web/nav-display.test.mjs

      - name: telemetry display retirement contract
        run: node clients/web/telemetry-display.test.mjs

      - name: transport session identity contract
        run: node clients/web/transport-session.test.mjs

      - name: control datagram capability contract
        run: node clients/web/datagram-control.test.mjs

      - name: state-frame ABI cross-language golden pin
        run: node clients/web/state-abi.test.mjs

      - name: instrument display fail-visible contract
        run: node clients/web/instruments.test.mjs

      - name: screen composition tests (INST-CONS-03)
        run: node clients/web/composition.test.mjs

      - name: renderer backend conformance corpus
        run: node clients/web/scene-conformance.test.mjs

      - name: browser video capture-identity tests (HUD-01)
        run: node clients/web/video-identity.test.mjs

      - name: viewer video-diagnostics decision logic (readiness dedup + read-failure coalescing)
        run: node clients/web/video-diagnostics.test.mjs

      - name: video stall transitions (frame-arrival freshness, enter/recover once)
        run: node clients/web/video-stall.test.mjs

      - name: viewer video-source routing (FPV + chase + gimbal payload)
        run: node clients/web/video-routing.test.mjs

      - name: viewer incoming-uni-stream accept-loop lifecycle (stream isolation + terminal collection)
        run: node clients/web/uni-stream-accept.test.mjs

      - name: multiplexed video stream framing (live records, split boundaries, copied bodies)
        run: node clients/web/video-stream.test.mjs

      - name: viewer bootstrap reader (no LeaseRequest on auto-reconnect, pre-welcome rejection signal)
        run: node clients/web/bootstrap.test.mjs

      - name: viewer connection auto-recovery lifecycle (backoff/jitter, classification, control-suspended)
        run: node clients/web/reconnect.test.mjs

      - name: viewer session discovery (manifest validation, stale-tab convergence, visibility-deferred autoconnect)
        run: node clients/web/session-discovery.test.mjs

      - name: viewer control arm-edge detection (rising edges, hold-across-reconnect safety)
        run: node clients/web/control-edges.test.mjs

      - name: control runtime golden vectors (wasm == native plans)
        # The wasm control runtime must produce the SAME plan as the native
        # Rust golden_vectors test for the same raw samples and profile; this
        # drives the real wasm artifact built above.
        run: node clients/web/control-runtime.test.mjs

      - name: control shell structural contract (no browser module holds mapping logic)
        run: node clients/web/control-structure.test.mjs

      - name: typed-command chain (real wasm -> advertised envelope -> shared wire fixture)
        run: node clients/web/typed-command.test.mjs

      - name: viewer input-loss gate (latched blur, no post-latch frames, held-button safety)
        run: node clients/web/control-gate.test.mjs

      - name: control-loop macrotask pacing (gated un-latched path must not microtask-spin)
        run: node clients/web/control-pacing.test.mjs

      - name: control-loop failure surface (channel-death release, keyup delivery, rejection re-log)
        run: node clients/web/control-loop-failsafe.test.mjs

      - name: motion-lease reacquisition (release fence, stale-grant rejection, terminal denial)
        run: node clients/web/motion-lease.test.mjs

      - name: authority stream live decode (fragmented LinkLossCleared, generation correlation)
        run: node clients/web/authority-stream.test.mjs

      - name: uni-stream reader (0x01 tag + fragmented open stream + live recovery transition)
        run: node clients/web/uni-stream.test.mjs

      - name: headless-CDP media recovery (cancelled reader credit + live-session re-attach)
        run: node clients/web/media-recovery.browser.test.mjs

      - name: viewer explicit lease release (ack/timeout/abandon, reconnect awaits settlement)
        run: node clients/web/lease-release.test.mjs

      - name: viewer connect lifecycle under a racing blur (live lease probe, immediate release)
        run: node clients/web/connect-lifecycle.test.mjs

      - name: wasm wire-decode conformance (REN)
        # The wasm exports the viewer decodes with must agree with the JS
        # reference decoders on layout, numeric kinds, and the capture-identity
        # contract; this loads the real wasm artifact built above.
        run: node clients/web/wire-wasm.test.mjs

      - name: browser H.264 decode lifecycle + Annex-B fixture (REN)
        run: node clients/web/video-h264.test.mjs

      - name: real Chromium/WebCodecs fixture decode (VID-02)
        # A real browser decodes the recorded Annex-B fixture through the
        # viewer's wasm session machine and platform adapter: every frame
        # output, at the recorded dimensions, and closed by the adapter.
        run: node clients/web/video-h264.browser.test.mjs

      - name: control module browser boot (real wasm, one real control tick)
        # A real browser imports the control module, instantiates the wasm,
        # bootstraps the default profile, and runs one evaluate() tick.
        run: node clients/web/control-runtime.browser.test.mjs

      - name: viewer entrypoint boot contract (VID-04)
        # A real browser loads the unmodified index.html + main.js: module
        # evaluation must complete with no wasm-backed object constructed
        # before wasm init, a good wasm load ends in live panels, and a
        # failed wasm load degrades visibly without killing the viewer.
        run: node clients/web/viewer-boot.browser.test.mjs

      - name: browser snapshot-association tests (HUD-01)
        run: node clients/web/snapshot-association.test.mjs

      - name: browser camera calibration contract (HUD-02)
        run: node clients/web/calibration.test.mjs

      - name: browser turn-derivation tests (DYN-01)
        run: node clients/web/turn-derivation.test.mjs

      - name: feeder degraded-mode contract (wasm absent)
        run: node clients/web/feeder-degraded.test.mjs

      - name: browser wire-range identity bounds (GEO-68)
        run: node clients/web/wire-bounds.test.mjs

      - name: geodetic fix decoding (ADR-0022)
        run: node clients/web/geodetic-fix.test.mjs

      - name: Setup buf
        if: hashFiles('schemas/**/*.proto') != ''
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        if: hashFiles('schemas/**/*.proto') != ''
        run: buf lint schemas

      - name: buf breaking
        if: hashFiles('schemas/**/*.proto') != ''
        # Detect wire-schema breakage against the target of this PR (or the
        # default branch on push), so field-number reuse and other incompatible
        # edits fail CI (ADR-0014). buf hard-fails when the base ref contains
        # no .proto files at all (a module with zero protos is an error, not an
        # empty baseline), so the comparison is skipped until schemas exist on
        # the base ref.
        run: |
          base="${{ github.base_ref || github.event.repository.default_branch }}"
          if git ls-tree -r "origin/${base}" --name-only | grep -q '^schemas/.*\.proto$'; then
            buf breaking schemas --against ".git#ref=refs/remotes/origin/${base},subdir=schemas"
          else
            echo "origin/${base} has no .proto files yet; nothing to compare against."
          fi

  apple-instrument-consumer:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select the newest Xcode on the runner
        run: |
          # The package declares a tools version the runner's default Xcode is older
          # than, and the failure reads as a package problem rather than a runner one.
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version

      - name: Authorize the private git dependency (Navigate)
        env:
          NAVIGATE_DEPLOY_KEY: ${{ secrets.NAVIGATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NAVIGATE_DEPLOY_KEY" > ~/.ssh/navigate_ci
          chmod 600 ~/.ssh/navigate_ci
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github-navigate\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/navigate_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-navigate/luofang34/Navigate".insteadOf "https://github.com/luofang34/Navigate"

      - name: Authorize the private Swift dependency (IndicateAppleDisplay)
        env:
          INDICATE_APPLE_DISPLAY_DEPLOY_KEY: ${{ secrets.INDICATE_APPLE_DISPLAY_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$INDICATE_APPLE_DISPLAY_DEPLOY_KEY" > ~/.ssh/indicate_apple_display_ci
          chmod 600 ~/.ssh/indicate_apple_display_ci
          printf 'Host github-indicate-apple-display\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/indicate_apple_display_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-indicate-apple-display/luofang34/IndicateAppleDisplay".insteadOf "https://github.com/luofang34/IndicateAppleDisplay"

      - name: Authorize the private situation domain dependencies
        env:
          AIRMASS_DEPLOY_KEY: ${{ secrets.AIRMASS_DEPLOY_KEY }}
          SURVEILLANCE_DEPLOY_KEY: ${{ secrets.SURVEILLANCE_DEPLOY_KEY }}
        run: |
          if [ -z "$AIRMASS_DEPLOY_KEY" ] || [ -z "$SURVEILLANCE_DEPLOY_KEY" ]; then
            echo "::error::AIRMASS_DEPLOY_KEY and SURVEILLANCE_DEPLOY_KEY must contain private deploy keys." >&2
            exit 1
          fi
          printf '%s\n' "$AIRMASS_DEPLOY_KEY" > ~/.ssh/airmass_ci
          printf '%s\n' "$SURVEILLANCE_DEPLOY_KEY" > ~/.ssh/surveillance_ci
          chmod 600 ~/.ssh/airmass_ci ~/.ssh/surveillance_ci
          printf 'Host github-airmass\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/airmass_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          printf 'Host github-surveillance\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/surveillance_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-airmass/luofang34/Airmass".insteadOf "https://github.com/luofang34/Airmass"
          git config --global url."ssh://git@github-surveillance/luofang34/Surveillance".insteadOf "https://github.com/luofang34/Surveillance"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate the bridge and test the Apple consumer
        run: bash scripts/check-apple-instrument-consumer.sh

  apple-client:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select the newest Xcode on the runner
        run: |
          # The package declares a tools version the runner's default Xcode is older
          # than, and the failure reads as a package problem rather than a runner one.
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version

      - name: Authorize the private situation domain dependencies
        env:
          AIRMASS_DEPLOY_KEY: ${{ secrets.AIRMASS_DEPLOY_KEY }}
          SURVEILLANCE_DEPLOY_KEY: ${{ secrets.SURVEILLANCE_DEPLOY_KEY }}
        run: |
          if [ -z "$AIRMASS_DEPLOY_KEY" ] || [ -z "$SURVEILLANCE_DEPLOY_KEY" ]; then
            echo "::error::AIRMASS_DEPLOY_KEY and SURVEILLANCE_DEPLOY_KEY must contain private deploy keys." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$AIRMASS_DEPLOY_KEY" > ~/.ssh/airmass_ci
          printf '%s\n' "$SURVEILLANCE_DEPLOY_KEY" > ~/.ssh/surveillance_ci
          chmod 600 ~/.ssh/airmass_ci ~/.ssh/surveillance_ci
          printf 'Host github-airmass\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/airmass_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          printf 'Host github-surveillance\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/surveillance_ci\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."ssh://git@github-airmass/luofang34/Airmass".insteadOf "https://github.com/luofang34/Airmass"
          git config --global url."ssh://git@github-surveillance/luofang34/Surveillance".insteadOf "https://github.com/luofang34/Surveillance"

      - name: Require the AeroLink deploy key
        env:
          AERO_LINK_DEPLOY_KEY: ${{ secrets.AERO_LINK_DEPLOY_KEY }}
        run: |
          if [ -z "$AERO_LINK_DEPLOY_KEY" ]; then
            echo "::error::AERO_LINK_DEPLOY_KEY must contain a private deploy key." >&2
            exit 1
          fi

      - name: Checkout the pinned AeroLink source
        uses: actions/checkout@v7
        with:
          repository: luofang34/aero-link
          ref: 241970ee918aa51aa90eb84e62544874c22f79b1
          path: external/aero-link
          ssh-key: ${{ secrets.AERO_LINK_DEPLOY_KEY }}

      - name: Checkout the pinned Airmass source
        uses: actions/checkout@v7
        with:
          repository: luofang34/Airmass
          ref: fbfec00b07b8bb34d44c951b0f98a33543487537
          path: external/Airmass
          ssh-key: ${{ secrets.AIRMASS_DEPLOY_KEY }}

      - name: Checkout the pinned Surveillance source
        uses: actions/checkout@v7
        with:
          repository: luofang34/Surveillance
          ref: 36b5d96052e817da92fc62d383196d11e449df10
          path: external/Surveillance
          ssh-key: ${{ secrets.SURVEILLANCE_DEPLOY_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      # The coastline archive is built from Natural Earth shapefiles, and project
      # generation builds it, so the job needs the converter that reads them.
      - name: Install GDAL
        run: brew install gdal

      - name: Test the Apple client
        env:
          AERO_LINK_SOURCE: ${{ github.workspace }}/external/aero-link
