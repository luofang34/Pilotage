[package]
name = "flight-tune-campaign"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Publication of verified flight tuning campaign evidence"

[lints]
workspace = true

[dependencies]
flight-tune = { workspace = true }
pilotage-control-feel = { workspace = true }
pilotage-flight-quality = { workspace = true }
pilotage-trial = { workspace = true }
pilotage-tuning-feedback = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The bench open-rollback tests drive a session lifecycle directly, which
# needs the harness-minted challenge that `test-support` exposes.
flight-tune = { workspace = true, features = ["test-support"] }
serde = { workspace = true }
serde_json = { workspace = true }
