[package]
name = "pilotage-session-host"
version = "0.1.0"
edition.workspace = true

[lib]
name = "pilotage_session_host"
path = "src/lib.rs"

[[bin]]
name = "pilotage-session-host"
path = "src/main.rs"

[dependencies]
pilotage-session = { workspace = true }
pilotage-geo = { workspace = true }
pilotage-protocol = { workspace = true }
pilotage-authority = { workspace = true }
pilotage-adapter-api = { workspace = true }
pilotage-control-feel = { workspace = true }
pilotage-adapter-reference = { workspace = true, optional = true }
pilotage-adapter-gazebo = { workspace = true, optional = true }
pilotage-sim-video = { workspace = true, optional = true }
pilotage-adapter-aviate = { workspace = true }
pilotage-adapter-px4 = { workspace = true }
pilotage-mission = { workspace = true }
pilotage-timing = { workspace = true }
navigate-contract = { workspace = true }
aerocontext-core = { workspace = true }
aerocontext-navdata = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
wtransport = { workspace = true, features = ["quinn"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
prost.workspace = true
jpeg-encoder = "0.7.0"

[features]
default = ["sim"]
# Simulation-only surface: the simulator adapters, the sidecar video
# client, and the FC adapters' camera paths. A flight build
# (--no-default-features) carries none of it; clients still adapt by
# discovery, never by build variants (ADR-0026).
sim = [
    "dep:pilotage-adapter-reference",
    "dep:pilotage-adapter-gazebo",
    "dep:pilotage-sim-video",
    "pilotage-adapter-aviate/sim",
    "pilotage-adapter-px4/sim",
]

[dev-dependencies]
pilotage-adapter-reference.workspace = true
pilotage-client-session = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wtransport = { workspace = true, features = ["dangerous-configuration", "quinn"] }

[lints]
workspace = true
