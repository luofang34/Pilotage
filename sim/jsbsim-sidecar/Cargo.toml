[package]
name = "pilotage-jsbsim-sidecar"
description = "JSBSim flight-dynamics sidecar: rigid-body truth on the shared world, synthetic sensors, and PX4's MAVLink simulator link"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Built on its own, with its own lockfile and only public dependencies,
# so a checkout without access to the workspace's private git
# dependencies (Aviate's CI) builds it. See the root manifest's
# `exclude`.
[workspace]

# The Pilotage workspace lint table, repeated, with one change: unsafe code is denied
# instead of forbidden. The `cpp` feature's call into JSBSim's C++ library
# needs it; every unsafe use sits in src/engine/ffi.rs, and the
# production-rust-lints guard refuses it anywhere else in this crate.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[features]
# Adds JSBSim's C++ library as a second engine, chosen with `--engine cpp`.
# It needs the external checkout `scripts/build-jsbsim.sh` produces.
cpp = ["dep:cc"]

[[bin]]
name = "pilotage-jsbsim-sidecar"
path = "src/main.rs"

[dependencies]
jsbsim = "0.1.1"
pilotage-mavlink-framing = { path = "../../crates/pilotage-mavlink-framing" }
pilotage-terrain-query = { path = "../../crates/pilotage-terrain-query" }
pilotage-world = { path = "../../crates/pilotage-world", default-features = false, features = ["archive"] }
thiserror = { version = "2.0.18", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The rev the root manifest pins for the shared world model; xtask's
# tests hold the two equal.
world-atmosphere = { git = "https://github.com/luofang34/world", rev = "8da6f84c0959d13b4554ade6e0fb166dfe8e2236" }
world-core = { git = "https://github.com/luofang34/world", rev = "8da6f84c0959d13b4554ade6e0fb166dfe8e2236" }

[dev-dependencies]
pilotage-geo = { path = "../../crates/pilotage-geo" }

[build-dependencies]
cc = { version = "1.2.66", optional = true }
