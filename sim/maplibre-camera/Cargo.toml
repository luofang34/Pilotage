[package]
name = "pilotage-maplibre-camera"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Simulator camera producer that renders a vehicle's views from the maplibre-rs world model"

# Built on its own: it links a GPU renderer the Pilotage workspace does not
# compile (see the root manifest's `exclude`).
[workspace]

[[bin]]
name = "pilotage-maplibre-camera"
path = "src/main.rs"

[dependencies]
# Pinned to a merge on the fork's main: FrameReadback, the
# {bbox-epsg-3857} tile URL placeholder, and drapes that do not wait on a
# raster source that will not deliver.
maplibre = { git = "https://github.com/luofang34/maplibre-rs-experimental", rev = "7b9c72630b886b9f72b8b86363ee7f207a72d00c", default-features = false, features = ["headless", "raster", "thread-safe-futures"] }
wgpu = "30.0.1"
cgmath = "0.18.0"
pilotage-sim-video = { path = "../../adapters/sim-video" }
pilotage-camera-calibration = { path = "../../crates/pilotage-camera-calibration" }
pilotage-calibration-id = { path = "../../crates/pilotage-calibration-id" }
indicate-frames = { git = "https://github.com/luofang34/Indicate.git", rev = "ae32a218f963ee7133a0a8ccfdbcc4afd491b184" }
prost = "0.14.4"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
serde_json = "1.0.150"
async-trait = "0.1.92"
base64 = "0.22.1"
directories = "6.0.0"

# The Pilotage workspace lint table, repeated at the same levels.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
