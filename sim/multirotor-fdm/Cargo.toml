[package]
name = "pilotage-multirotor-fdm"
description = "Rigid-body quadcopter flight-dynamics sidecar that closes Betaflight SITL's motor-to-sensor loop"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "pilotage-multirotor-fdm"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
pilotage-msp = { workspace = true }
