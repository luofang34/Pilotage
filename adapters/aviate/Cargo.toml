[package]
name = "pilotage-adapter-aviate"
description = "Telemetry-only VehicleAdapter for the Aviate flight controller over its MAVLink 2.0 subset (ADR-0018)"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aviate-xil-contract = { workspace = true, optional = true }
aviate-xil-shm = { workspace = true, optional = true }
getrandom = { version = "0.3.4", features = ["std"] }
pilotage-adapter-api = { workspace = true }
pilotage-control-feel = { workspace = true }
pilotage-mavlink = { workspace = true }
pilotage-sim-video = { workspace = true, optional = true }
pilotage-protocol = { workspace = true }
pilotage-timing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
pilotage-control-web = { path = "../../clients/web-control" }
pilotage-input = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "rt-multi-thread"] }

[features]
default = ["sim"]
# Simulation-only code: the camera sidecar client and the XIL
# truth-oracle attachment. A flight build turns this off; the adapter
# then has no video producer and no simulation profile at all.
sim = ["dep:pilotage-sim-video", "dep:aviate-xil-contract", "dep:aviate-xil-shm"]
