[package]
name = "pilotage-adapter-sim-multicopter"
description = "Simulated multicopter on the DJI Mini 3 control path, with an aerial-imagery camera"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
pilotage-adapter-api.workspace = true
pilotage-geo.workspace = true
pilotage-protocol.workspace = true
pilotage-timing.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
