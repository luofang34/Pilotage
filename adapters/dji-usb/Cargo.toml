[package]
name = "pilotage-dji-usb"
description = "Bounded macOS USB ownership for a DJI upper logiclink interface"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[lints.rust]
# The ffi module binds the IOKit interface owned by one worker thread.
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
