[workspace]
resolver = "3"
members = [
    "crates/pilotage-navdata-cycle",
    "crates/pilotage-protocol",
    "crates/pilotage-authority",
    "crates/pilotage-session",
    "crates/pilotage-ingress",
    "crates/pilotage-input",
    "crates/pilotage-timing",
    "crates/pilotage-adapter-api",
    "crates/pilotage-mavlink",
    "crates/pilotage-conformance",
    "crates/pilotage-situation-view",
    "crates/pilotage-airspace-view",
    "crates/pilotage-navdata-tiles",
    "crates/pilotage-calibration-id",
    "crates/pilotage-camera-calibration",
    "crates/pilotage-geo",
    "crates/pilotage-svs-db",
    "crates/pilotage-svs-build",
    "crates/pilotage-terrain-build",
    "crates/pilotage-terrain-query",
    "crates/pilotage-mission",
    "crates/pilotage-instrument-runtime",
    "crates/pilotage-client-session",
    "crates/pilotage-instrument-feed",
    "crates/pilotage-presentation",
    "crates/pilotage-trial",
    "crates/pilotage-control-feel",
    "crates/pilotage-flight-quality",
    "crates/pilotage-durable-storage",
    "adapters/reference-headless",
    "adapters/aviate",
    "adapters/px4",
    "tools/hid-probe",
    "tools/flight-tune",
    "tools/flight-tune-aviate",
    "tools/loopback-probe",
    "tools/xtask",
    "hosts/session-host",
    "adapters/gazebo",
    "adapters/sim-video",
    "clients/web-instruments",
    "clients/web-instrument-shell",
    "clients/web-control",
    "clients/apple-instrument-bridge",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# The Aviate XIL contract crates are consumed only at one exact upstream
# revision: both crates must always pin the identical rev so the layout
# types, the transport, and the canonical object name cannot drift apart.
aviate-xil-contract = { git = "https://github.com/luofang34/Aviate.git", rev = "ac9bd248406a892fbe97a712d921326c96abd8b6" }
aviate-xil-shm = { git = "https://github.com/luofang34/Aviate.git", rev = "ac9bd248406a892fbe97a712d921326c96abd8b6" }
# The Navigate crates are consumed only at one exact upstream revision:
# all five crates must always pin the identical rev so the contract
# vocabulary, fusion, plan sequencing, guidance, and geodesy cannot
# drift apart (the same discipline as the aviate-xil pins above).
navigate-contract = { git = "https://github.com/luofang34/Navigate.git", rev = "ace50f68b3ffae6237bbb53f6af687c335518272" }
navigate-geodesy = { git = "https://github.com/luofang34/Navigate.git", rev = "ace50f68b3ffae6237bbb53f6af687c335518272" }
navigate-fusion = { git = "https://github.com/luofang34/Navigate.git", rev = "ace50f68b3ffae6237bbb53f6af687c335518272" }
navigate-fpl = { git = "https://github.com/luofang34/Navigate.git", rev = "ace50f68b3ffae6237bbb53f6af687c335518272" }
navigate-guidance = { git = "https://github.com/luofang34/Navigate.git", rev = "ace50f68b3ffae6237bbb53f6af687c335518272" }
# The instrument family is consumed only at one exact upstream revision:
# every Indicate crate must always pin the identical rev so the state ABI,
# the scene vocabulary, the panels, and the registry digest cannot drift
# apart. The pilot of a change that moves the cross-shell scene digest
# advances this pin as part of that change (ADR-0034).
indicate-frames = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-alerts = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-scene = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-state = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-glyphs = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-panels = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-feeder = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
indicate-instrument-registry = { git = "https://github.com/luofang34/Indicate.git", rev = "985eb3390d3e09abf83d730f356668fe6499d01e" }
# The presentation input crates use exact revisions. The FFI facade and the
# portable adapter must read the same snapshot schemas.
surveillance-core = { git = "https://github.com/luofang34/Surveillance.git", rev = "36b5d96052e817da92fc62d383196d11e449df10", default-features = false }
surveillance-geojson = { git = "https://github.com/luofang34/Surveillance.git", rev = "36b5d96052e817da92fc62d383196d11e449df10", default-features = false }
airmass-core = { git = "https://github.com/luofang34/Airmass.git", rev = "fbfec00b07b8bb34d44c951b0f98a33543487537", default-features = false }
airmass-geojson = { git = "https://github.com/luofang34/Airmass.git", rev = "fbfec00b07b8bb34d44c951b0f98a33543487537", default-features = false }
aerocontext-core = "0.4.5"
aerocontext-planning = "0.4.5"
aerocontext-navdata = { version = "0.4.5", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
png = "0.18.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "serialize"] }
prost = "0.14.4"
prost-build = "0.14.4"
flate2 = "1.1.9"
libm = "0.2.16"
libc = "0.2.177"
wasm-bindgen = "=0.2.126"
serde-wasm-bindgen = "0.6.5"
hidapi = "2.6.6"
proptest = "1.11.0"
tokio = "1.48.0"
wtransport = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sha2 = "0.10.9"
rustix = { version = "=1.1.4", features = ["fs"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
uniffi = "0.32"
pilotage-timing = { path = "crates/pilotage-timing" }
pilotage-protocol = { path = "crates/pilotage-protocol" }
pilotage-client-session = { path = "crates/pilotage-client-session" }
pilotage-instrument-feed = { path = "crates/pilotage-instrument-feed" }
pilotage-authority = { path = "crates/pilotage-authority" }
pilotage-ingress = { path = "crates/pilotage-ingress" }
pilotage-input = { path = "crates/pilotage-input" }
pilotage-adapter-api = { path = "crates/pilotage-adapter-api" }
pilotage-mavlink = { path = "crates/pilotage-mavlink" }
pilotage-situation-view = { path = "crates/pilotage-situation-view" }
pilotage-airspace-view = { path = "crates/pilotage-airspace-view" }
pilotage-navdata-tiles = { path = "crates/pilotage-navdata-tiles" }
pilotage-calibration-id = { path = "crates/pilotage-calibration-id" }
pilotage-camera-calibration = { path = "crates/pilotage-camera-calibration" }
