// Internal host<->sidecar bridge wire types (ADR-0008). This package is
// deliberately separate from `pilotage.v1`: it is the private protocol
// between the Rust `pilotage-adapter-gazebo` host process and the C++
// gz-transport sidecar bridge over a localhost TCP connection, and MUST
// NOT be exposed to, or confused with, the public client protocol.
syntax = "proto3";

package pilotage.bridge.v1;

// A control command from the host to the sidecar, mapped from canonical
// control axes (throttle, yaw) to the vehicle's differential-drive
// command frame.
message BridgeControl {
  double linear_x = 1;
  double angular_z = 2;
}

// A single odometry sample from the sidecar to the host, already reduced
// to the planar pose and scalar speed the host's canonical telemetry model
// needs (ADR-0008): no raw gz.msgs.Odometry crosses this boundary.
message BridgeOdometry {
  double x = 1;
  double y = 2;
  double heading = 3;
  double speed = 4;
  uint64 sim_time_ns = 5;
}

// A single satellite-navigation fix from the sidecar to the host, reduced
// to the geodetic position the host's telemetry model needs (ADR-0008): no
// raw gz.msgs.NavSat crosses this boundary. Velocity is not carried — the
// truth sample the fix joins already reports it.
message BridgeNavSat {
  double latitude_deg = 1;
  double longitude_deg = 2;
  // Altitude as the sensor states it, metres.
  double altitude_m = 3;
  // The simulation clock, so the host can tell whether this fix and a
  // truth sample describe the same moment.
  uint64 sim_time_ns = 4;
}

// A single raw camera frame from the sidecar to the host, ahead of the
// host's own MJPEG encode step (ADR-0005): no raw gz.msgs.Image crosses
// this boundary.
message BridgeFrame {
  uint32 width = 1;
  uint32 height = 2;
  string pixel_format = 3;
  uint64 sim_time_ns = 4;
  bytes rgb = 5;
  // Video source this frame came from: 0 = onboard FPV camera, 1 = chase
  // camera. Additional sources may be assigned higher ids later.
  uint32 camera_id = 6;
  // The published camera calibration this frame was captured with, for a
  // producer whose calibration changes from frame to frame (a zoom
  // detent). Zero states none, and the host keeps the calibration it
  // binds to the camera.
  uint32 calibration_id = 7;
}

// A camera command from the host to a producer that owns a controllable
// view (the X-Plane camera plugin): which vehicle camera the view
// embodies, the gimbal orientation, and the zoom detent.
message BridgeCameraCommand {
  // Which vehicle camera the single rendered view embodies.
  //
  // The values are 1-based BECAUSE proto3 omits zero-valued scalars
  // from the wire: a zero-numbered mode could never be transmitted, and
  // a producer that treats a partial command as a delta would silently
  // keep whichever view it was already rendering. Zero therefore means
  // "unchanged", which is what an absent field already means.
  //   1 = FPV (body-fixed forward view)
  //   2 = gimbal payload view
  //   3 = free (the producer releases the view to its operator)
  uint32 mode = 1;
  // Gimbal pan, radians, positive right, relative to the vehicle body
  // heading (follow mode).
  float pan_rad = 2;
  // Gimbal tilt, radians, positive up, world-stabilized.
  float tilt_rad = 3;
  // Zoom detent index into the producer's published detent table; each
  // detent maps to one published camera calibration.
  uint32 zoom_detent = 4;
}

// The pointing of a vehicle's gimbal payload camera at one instant, with
// the same angle conventions as BridgeCameraCommand.
message BridgeGimbalPose {
  // Pan, radians, positive right, relative to the vehicle body heading.
  float pan_rad = 1;
  // Tilt, radians, positive up, relative to the horizon.
  float tilt_rad = 2;
  // Zoom detent index into the producer's published detent table.
  uint32 zoom_detent = 3;
}

// The true pose of the vehicle at one simulation instant, from the host to
// a producer that renders the vehicle's cameras from a world model rather
// than from a simulator scene. One pose drives every camera the producer
// owns: the forward camera is fixed to the body, the gimbal camera follows
// `gimbal`. Camera mounting offsets belong to the producer's published
// camera calibration, not to this message.
message BridgeViewPose {
  // Clock reading of the truth sample this pose came from. A frame the
  // producer renders from this pose carries this value as its
  // `BridgeFrame.sim_time_ns`.
  uint64 sim_time_ns = 1;
  // WGS-84 latitude of the body origin, degrees.
  double latitude_deg = 2;
  // WGS-84 longitude of the body origin, degrees.
  double longitude_deg = 3;
  // Height of the body origin, metres, against `vertical_datum`.
  double altitude_m = 4;
  // The reference of `altitude_m`, in the `pilotage.v1` vertical-datum
  // codes (1 ellipsoid, 2 mean sea level, 3 above ground level). A
  // producer refuses a datum it cannot place against its terrain rather
  // than guessing a height.
  uint32 vertical_datum = 5;
  // Body FRD to local NED attitude quaternion, Hamilton, scalar first.
  double q_w = 6;
  double q_x = 7;
  double q_y = 8;
  double q_z = 9;
  // The gimbal camera's pointing; absent when the vehicle reports no
  // gimbal, and the producer then keeps the last BridgeCameraCommand.
  BridgeGimbalPose gimbal = 10;
}

// Wraps exactly one bridge payload for length-delimited framing over the
// host<->sidecar TCP connection.
message BridgeEnvelope {
  oneof payload {
    BridgeControl control = 1;
    BridgeOdometry odometry = 2;
    BridgeFrame frame = 3;
    BridgeCameraCommand camera_command = 4;
    BridgeNavSat navsat = 5;
    BridgeViewPose view_pose = 6;
  }
}
