// Telemetry wire types (ADR-0011: best-effort by default, units and frames
// fixed by the schema).
syntax = "proto3";

package pilotage.v1;

import "pilotage/v1/common.proto";
import "pilotage/v1/payload.proto";

// A planar pose: position in meters and heading in radians, in the vehicle's
// local reference frame unless otherwise documented by the adapter
// capability (ADR-0008).
message Pose2d {
  float x_m = 1;
  float y_m = 2;
  float heading_rad = 3;
}

// Planar velocity: linear components in meters/second, angular in
// radians/second.
message Velocity2d {
  float linear_x_mps = 1;
  float linear_y_mps = 2;
  float angular_rad_s = 3;
}

// Aircraft avionics observations and separate estimator authorization.
// Canonical attitude is body FRD → world NED. A reported Euler attitude has
// unverified axis directions and reference. Neither grants authorization.
message AvionicsState {
  // Fields 1–7 are meaningful only when attitude_stamp is present. Proto3
  // scalar defaults are not measurements and must not be displayed as such.
  float quat_w = 1;
  float quat_x = 2;
  float quat_y = 3;
  float quat_z = 4;
  // Unknown body rates are NaN, including when an attitude quaternion is present.
  // Rates must also have estimator authorization before use in prediction.
  float rate_p_rad_s = 5;
  float rate_q_rad_s = 6;
  float rate_r_rad_s = 7;
  // Fields 8–13 are meaningful only when kinematics_stamp is present.
  float pos_n_m = 8;
  float pos_e_m = 9;
  float pos_d_m = 10;
  float vel_n_mps = 11;
  float vel_e_mps = 12;
  float vel_d_mps = 13;
  // Effective latched authorization: bit0 attitude, bit1 rates, bit2 position,
  // bit3 velocity. It can include fail-closed downgrades relative to the raw
  // status observation and is meaningful only when estimator_status_stamp is
  // present.
  uint32 valid_flags = 14;
  // Effective latched quality: 0 good, 1 degraded, 2 unusable. It can include
  // fail-closed downgrades relative to the raw status observation and is
  // meaningful only when estimator_status_stamp is present. This does not
  // rate reported_euler or device health.
  uint32 quality = 15;
  // 0 unknown, 1 disarmed, 2 armed (from the vehicle's own report).
  // FC-owned arm state with provenance is published as
  // TelemetrySample.fc_state; a publisher emitting fc_state leaves this
  // field 0 rather than merging an unstamped copy here.
  uint32 arm_state = 16 [deprecated = true];
  // Attitude/rates and position/velocity advance independently. Absence means
  // that group was not supplied in this publication.
  MeasurementStamp attitude_stamp = 17;
  MeasurementStamp kinematics_stamp = 18;
  // Acquisition identity of the status observation backing valid_flags and
  // quality. Absence means no explicit estimator authorization was supplied
  // and consumers fail closed.
  MeasurementStamp estimator_status_stamp = 19;
  // Barometric group: pressure altitude against the ISA standard datum
  // (1013.25 hPa), from the vehicle's static source. It approximates
  // true altitude only after a local pressure correction; displays must
  // label which they show. Meaningful only when baro_stamp is present.
  float baro_alt_m = 20;
  MeasurementStamp baro_stamp = 21;
  // The estimator's own geodetic fix. It advances independently of the
  // kinematics group above, so it carries its own stamp; both are
  // meaningful only when that stamp is present. Absence means the
  // estimator supplied no fix, never that the vehicle is at 0,0.
  GeodeticFix geodetic = 22;
  MeasurementStamp geodetic_stamp = 23;
  // The magnetic variation the vehicle states for its own position: the
  // angle from true north to magnetic north. It is the live statement of
  // which north the attitude yaw above uses, and it overrides the
  // heading_reference of the vehicle's capability advertisement when the
  // two disagree. It advances independently, so it carries its own stamp;
  // both are meaningful only when that stamp is present.
  MagneticVariation magnetic_variation = 24;
  MeasurementStamp magnetic_variation_stamp = 25;
  // Mutually exclusive with attitude_stamp. This representation cannot supply
  // canonical attitude/rates authorization or a north reference. Its numeric
  // values do not require canonical estimator quality to be present or usable.
  ReportedEulerAttitude reported_euler = 26;
}

// Device-reported aircraft Euler angles, for numeric display only.
// Axis directions and the horizontal reference are unverified. Consumers must
// not convert these values to a canonical quaternion or use them for navigation,
// control, horizon graphics, or prediction. A report is absent without its stamp.
message ReportedEulerAttitude {
  // Each angle uses the protocol's sign convention, in radians.
  float pitch_rad = 1;
  float roll_rad = 2;
  float yaw_rad = 3;
  MeasurementStamp stamp = 4;
}

// Where a magnetic variation value comes from.
enum MagneticVariationSource {
  // Not stated. A receiver treats the variation as unknown.
  MAGNETIC_VARIATION_SOURCE_UNSPECIFIED = 0;
  // The flight controller's own geomagnetic model at its position.
  MAGNETIC_VARIATION_SOURCE_FC_MODEL = 1;
  // A value configured on the flight controller.
  MAGNETIC_VARIATION_SOURCE_FC_CONFIGURED = 2;
  // A geomagnetic model shared by the host and its clients.
  MAGNETIC_VARIATION_SOURCE_SHARED_MODEL = 3;
  // A published aeronautical chart value.
  MAGNETIC_VARIATION_SOURCE_PUBLISHED_CHART = 4;
  // A value the operator entered.
  MAGNETIC_VARIATION_SOURCE_OPERATOR = 5;
  // The vehicle applies no variation: its attitude yaw is magnetic, and
  // declination_rad carries no value.
  MAGNETIC_VARIATION_SOURCE_NONE = 6;
}

// One magnetic variation value.
message MagneticVariation {
  // Declination: the angle from true north to magnetic north, in radians,
  // positive east. Not meaningful when source is
  // MAGNETIC_VARIATION_SOURCE_NONE.
  float declination_rad = 1;
  MagneticVariationSource source = 2;
  // The geomagnetic model that produced the value, for example "WMM2025".
  // Empty when the source does not state it.
  string model_id = 3;
  // The model's epoch as a decimal year. 0 when the source does not state
  // it.
  double model_epoch = 4;
}

// One geodetic fix: where a vehicle is on the Earth, with the datum the
// position is measured against fully declared (ADR-0022).
//
// Absence of this message means NO FIX. A receiver must not substitute a
// zero, a last-known value, or a position derived from a declared origin:
// 0,0 is a real place in the Gulf of Guinea and would draw as a plausible
// vehicle. A receiver builds the value through the geodetic contract, so a
// datum it cannot interpret is refused rather than displayed.
//
// The message carries no availability and no health. Both are DERIVED at
// the receiver from the datum identities and the accuracy below, so no
// producer can claim a position is usable (ADR-0022).
message GeodeticFix {
  // Latitude in degrees, in [-90, 90].
  double latitude_deg = 1;
  // Longitude in degrees, normalized by the producer to [-180, 180).
  double longitude_deg = 2;
  // pilotage_geo::HorizontalDatum: 0 unknown, 1 WGS-84, 2 NAD83,
  // 3 ITRF2014. Unknown is refused at the receiver, never guessed.
  uint32 horizontal_datum = 3;
  // Realization or reference epoch of the horizontal datum. 0 is
  // UNDECLARED, which a datum that needs one is refused for.
  uint32 realization = 4;
  // Height against the vertical datum below.
  double height_m = 5;
  // pilotage_geo::VerticalDatum: 0 unknown, 1 ellipsoid, 2 MSL, 3 AGL,
  // 4 baro-indicated, 5 pressure, 6 local-relative.
  uint32 vertical_datum = 6;
  // The identity the vertical datum requires. 0 is UNDECLARED and makes a
  // height that needs it uninterpretable: MSL needs a geoid model, AGL a
  // terrain reference, baro-indicated an applied setting, and
  // local-relative an origin.
  uint32 geoid_model = 7;
  uint32 terrain_ref = 8;
  uint32 baro_setting = 9;
  uint64 local_origin = 10;
  // 1-sigma accuracy, millimeters. A length, never a score. Zero means
  // UNSTATED, not perfect: proto3 omits a zero field, so a producer that
  // states nothing and a producer that claims perfection would otherwise
  // be the same bytes, and silence would rate as the best possible fix.
  uint32 horizontal_accuracy_mm = 11;
  uint32 vertical_accuracy_mm = 12;
}

// One coherent simulator ground-truth sample: the simulation oracle for
// logging, test assertions, and estimate-versus-truth comparison in
// simulation profiles only. Truth is not an FC estimator output: it drives
// no primary panel, never constructs operational commands, and is never a
// fallback for a missing estimate. Physical profiles must not publish it.
message SimTruthState {
  // Attitude quaternion (w, x, y, z), body FRD → world NED.
  float quat_w = 1;
  float quat_x = 2;
  float quat_y = 3;
  float quat_z = 4;
  // NED position (meters) and velocity (m/s).
  float pos_n_m = 5;
  float pos_e_m = 6;
  float pos_d_m = 7;
  float vel_n_mps = 8;
  float vel_e_mps = 9;
  float vel_d_mps = 10;
  // Identity and acquisition of this truth observation. Absence makes the
  // sample unconsumable: truth without provenance is discarded.
  MeasurementStamp stamp = 11;
  // Which truth fields this sample carries, in the estimate mask's bit
  // positions: bit0 attitude, bit1 rates, bit2 position, bit3 velocity.
  // Availability only — truth has no estimator authorization to claim.
  uint32 valid_flags = 12;
  // The oracle's geodetic position. It comes from the same observation as
  // the NED group above and rides this sample's stamp, so it claims no
  // advance of its own. Absence means the simulator declared no position.
  GeodeticFix geodetic = 13;
}

// FC-owned vehicle state (arm today; mode/failsafe belong here as they
// arrive) under its own provenance stamp: the FC is the only author, and
// the stamp records the link observation that reported it.
message FcState {
  // 0 unknown, 1 disarmed, 2 armed.
  uint32 arm_state = 1;
  // Identity and acquisition of the FC report carrying this state.
  // Absence makes the sample unconsumable.
  MeasurementStamp stamp = 2;
  // The FC's acknowledgement of the most recent commanded arm or disarm:
  // 0 none observed, 1 the command was an arm, 2 a disarm. Enactment
  // truth for the operator — the action-result path's command-acceptance
  // semantics are unchanged by this lane.
  uint32 last_command_kind = 3;
  // A flight-controller-specific result code. Hosts do not write it.
  // Read last_command_outcome.
  uint32 last_command_result = 4 [deprecated = true];
  // The typed answer to that command; meaningful only when
  // last_command_kind is non-zero.
  CommandOutcome last_command_outcome = 5;
}

// The vehicle's answer to one discrete command, independent of the flight
// controller family. The adapter translates its flight controller's own
// result codes into this vocabulary, so a client never decodes them.
//
// Answer window: a host answers an arm or disarm within
// pilotage_protocol::COMMAND_ANSWER_WINDOW_MS (5000 ms) of the command.
// An adapter that needs more time reports IN_PROGRESS, and each new
// IN_PROGRESS starts the window again. A client that sees no answer in the
// window tells the operator that the vehicle did not answer.
enum CommandOutcome {
  // No answer is known. A client must not read this as accepted.
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  // The vehicle accepted the command.
  COMMAND_OUTCOME_ACCEPTED = 1;
  // The vehicle works on the command and will answer again.
  COMMAND_OUTCOME_IN_PROGRESS = 2;
  // The vehicle cannot do the command now; it can be possible later (a
  // failed preflight check is the usual cause).
  COMMAND_OUTCOME_TEMPORARILY_REJECTED = 3;
  // The vehicle refused the command.
  COMMAND_OUTCOME_DENIED = 4;
  // The vehicle does not support the command.
  COMMAND_OUTCOME_UNSUPPORTED = 5;
  // The vehicle tried the command and it failed.
  COMMAND_OUTCOME_FAILED = 6;
  // The vehicle stopped the command before it was complete.
  COMMAND_OUTCOME_CANCELLED = 7;
}

// Gimbal device orientation (Gimbal Protocol v2 attitude status) under its
// own provenance stamp: payload-device state, never a vehicle estimate and
// never an input to control validation.
message GimbalAttitude {
  // Orientation quaternion (w, x, y, z). Roll and pitch are relative to
  // the horizon. Yaw is relative to the frame that yaw_frame names.
  float quat_w = 1;
  float quat_x = 2;
  float quat_y = 3;
  float quat_z = 4;
  // Device angular velocity (rad/s); NaN encodes device-unknown.
  float rate_x_rad_s = 5;
  float rate_y_rad_s = 6;
  float rate_z_rad_s = 7;
  // Identity and acquisition of the device report. Absence makes the
  // sample unconsumable.
  MeasurementStamp stamp = 8;
  // Flight-controller-specific device mode bits. Hosts do not write
  // them. Read yaw_frame and the lock fields.
  uint32 flags = 9 [deprecated = true];
  // Non-zero reports a device failure condition.
  uint32 failure_flags = 10;
  // The frame that the quaternion's yaw is relative to. UNSPECIFIED
  // means that the yaw has no known frame: a client must not show it as
  // a heading or as a vehicle-relative angle.
  GimbalYawFrame yaw_frame = 11;
  // True when the device holds that axis fixed relative to the Earth.
  // False when that axis follows the vehicle.
  bool roll_locked = 12;
  bool pitch_locked = 13;
  bool yaw_locked = 14;
}

// The frame that a gimbal yaw angle is relative to.
enum GimbalYawFrame {
  GIMBAL_YAW_FRAME_UNSPECIFIED = 0;
  // Yaw is relative to the vehicle's forward axis.
  GIMBAL_YAW_FRAME_VEHICLE = 1;
  // Yaw is relative to true north.
  GIMBAL_YAW_FRAME_EARTH = 2;
}

// Battery state as the flight controller reports it, under the FC-state
// role: vehicle state, never an estimate and never a control input. Each
// float is NaN when the flight controller reports it as unknown.
message BatteryState {
  // Identity and acquisition of the battery report. Absence makes the
  // sample unconsumable.
  MeasurementStamp stamp = 1;
  // Battery instance on the vehicle.
  uint32 instance = 2;
  // Remaining capacity as a fraction, 0 to 1.
  float remaining_fraction = 3;
  // Pack voltage, volts.
  float voltage_v = 4;
  // Current out of the battery, amperes. Negative while charging.
  float current_a = 5;
  // Energy used since the battery was connected, joules.
  float consumed_energy_j = 6;
  // Time until empty at the present draw, seconds. Zero is unknown.
  uint32 time_remaining_s = 7;
}

// Active-leg guidance from the vehicle's navigation component (ADR-0031)
// under its own provenance stamp: display context in raw canonical units.
// Scaling deviations to instrument dots is display policy and never
// crosses the wire. Absence means no guidance — receivers remove the
// deviation display rather than centering it.
message NavGuidanceState {
  // Identity and acquisition of this guidance sample. Absence makes the
  // sample unconsumable: guidance without provenance is discarded.
  MeasurementStamp stamp = 1;
  // Identifier of the waypoint being flown toward.
  string to_ident = 2;
  // Identifier of the leg's origin fix; empty on a direct-to leg, which
  // is flown from the present position and has no upstream fix.
  string from_ident = 3;
  // Desired track of the active leg, radians clockwise from true north in
  // [0, 2π). On a direct-to leg this is the live bearing to the waypoint.
  float course_rad = 4;
  // Cross-track deviation from the desired track in meters, positive
  // right of course. NaN when guidance is not tracking a lateral course
  // (e.g. climb): a direct-to leg's track is anchored at ownship, so
  // there is no cross-track geometry, and zero would read as on-course.
  float lateral_deviation_m = 5;
  // Deviation from the vertical profile in meters, positive above the
  // profile; NaN when the active leg carries no vertical constraint.
  float vertical_deviation_m = 6;
  // Great-circle distance to the active waypoint, meters.
  float distance_to_waypoint_m = 7;
  // Index of the active leg's destination waypoint in fly order, 0-based.
  uint32 leg_index = 8;
  // Waypoints in the plan being flown.
  uint32 waypoint_count = 9;
  // Quality of the navigation solution this guidance rests on: 0 good,
  // 1 degraded, 2 unusable. Consumers remove the guidance display on
  // unusable rather than displaying it with a caution.
  uint32 solution_quality = 10;
}

// A single best-effort telemetry sample for one vehicle.
message TelemetrySample {
  // Adapter-owned procedure progress. This is not an FC measurement.
  FlightProcedureState flight_procedure = 13;
  PayloadState payload = 12;
  VehicleId vehicle = 1;
  SimTick tick = 2;
  // Host publication time. This is transport metadata, not source
  // acquisition time; group acquisition stamps live in AvionicsState.
  MonoTimestamp observed_at = 3;
  // Absence means no coherent planar projection is available. Receivers must
  // not substitute an origin pose or zero velocity.
  Pose2d pose = 4;
  Velocity2d velocity = 5;
  AvionicsState avionics = 6;
  // Simulation-truth oracle, independent of avionics in identity, epoch,
  // sequence, clock, and validity; never an operational fallback.
  SimTruthState sim_truth = 7;
  // FC-owned arm/mode state with its own provenance stamp.
  FcState fc_state = 8;
  // Gimbal payload-device orientation with its own provenance stamp.
  GimbalAttitude gimbal = 9;
  // Active-leg navigation guidance with its own provenance stamp,
  // published by the navigation component rather than the FC adapter.
  NavGuidanceState nav_guidance = 10;
  // Battery state with its own provenance stamp.
  BatteryState battery = 11;
}

// The control request that started a flight procedure. Vehicle identity is
// supplied by the enclosing telemetry sample.
message FlightProcedureRequest {
  SessionId session = 1;
  ScopeId scope = 2;
  Generation generation = 3;
  SequenceNum sequence = 4;
  uint32 action_id = 5;
}

// Progress owned by the adapter. Re-publication must preserve the revision
// and change time; it must not imply a fresh vehicle observation. Unknown
// enum values do not establish progress or completion.
message FlightProcedureState {
  FlightProcedureRequest request = 1;
  // Exactly 16 bytes. Compare only for equality at an attachment boundary.
  bytes adapter_incarnation = 2;
  // Wrapping revision within this request, changed only on a status transition.
  uint64 revision = 3;
  // Monotonic time since adapter start, not vehicle boot or publication time.
  MonoTimestamp changed_at = 4;
  FlightProcedureKind kind = 5;
  FlightProcedurePhase phase = 6;
  FlightProcedureReason reason = 7;
  // An FC acknowledgement is distinct from observed procedure completion.
  CommandOutcome fc_outcome = 8;
}

enum FlightProcedureKind {
  FLIGHT_PROCEDURE_KIND_UNSPECIFIED = 0;
  FLIGHT_PROCEDURE_KIND_TAKEOFF = 1;
}

enum FlightProcedurePhase {
  FLIGHT_PROCEDURE_PHASE_UNSPECIFIED = 0;
  FLIGHT_PROCEDURE_PHASE_QUEUED = 1;
  FLIGHT_PROCEDURE_PHASE_WRITTEN = 2;
  FLIGHT_PROCEDURE_PHASE_IN_PROGRESS = 3;
  // Only a fresh vehicle observation can establish completion.
  FLIGHT_PROCEDURE_PHASE_COMPLETED = 4;
  FLIGHT_PROCEDURE_PHASE_FAILED = 5;
  // Completion was not established before the deadline. The vehicle can
  // still be moving; this phase does not confirm a stop.
  FLIGHT_PROCEDURE_PHASE_TIMED_OUT = 6;
  // The adapter stopped tracking or issuing the procedure. This does not
  // confirm that the vehicle stopped its autonomous motion.
  FLIGHT_PROCEDURE_PHASE_CANCELLED = 7;
}

enum FlightProcedureReason {
  FLIGHT_PROCEDURE_REASON_UNSPECIFIED = 0;
  FLIGHT_PROCEDURE_REASON_COMMAND_REFUSED = 1;
  FLIGHT_PROCEDURE_REASON_WRITE_FAILED = 2;
  FLIGHT_PROCEDURE_REASON_DEADLINE_EXPIRED = 3;
  FLIGHT_PROCEDURE_REASON_MEASUREMENT_UNAVAILABLE = 4;
  FLIGHT_PROCEDURE_REASON_SOURCE_CHANGED = 5;
  FLIGHT_PROCEDURE_REASON_AUTHORITY_LOST = 6;
  FLIGHT_PROCEDURE_REASON_VEHICLE_DISARMED = 7;
  FLIGHT_PROCEDURE_REASON_MODE_CHANGED = 8;
  FLIGHT_PROCEDURE_REASON_INTERRUPTED = 9;
}
