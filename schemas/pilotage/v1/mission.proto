// Mission records, intents, receipts and status (ADR-0052).
//
// A mission is five records: the objective (what the operator wants), the
// proposal (a compiled plan with its estimates and assumptions), the
// approval (a permission bound to one proposal digest with an adaptation
// envelope), the plan (the immutable mission document the host executes,
// referenced here by its digest) and the run (what the vehicle did,
// reported in the status). A lane is the one mission executor of a
// vehicle or of a team; a coordinator's lane speaks the same messages to
// its operator as a vehicle's lane does.
syntax = "proto3";

package pilotage.v1;

// A WGS-84 position, degrees.
message GeoPoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
}

// Who made a record: the identity issuer, the subject at that issuer and
// the owning organization (ADR-0049).
message RecordOrigin {
  string issuer = 1;
  string subject = 2;
  string organization = 3;
}

// An area survey: cover the polygon with nadir pictures at a height above
// the launch point. A zero numeric field takes the host's default.
message SurveyObjective {
  // The area, at least three vertices, in order.
  repeated GeoPoint area = 1;
  // The launch point; the plan returns here when `return_to_launch`.
  GeoPoint launch = 2;
  // The launch point's altitude in the plan's altitude reference, metres.
  double launch_altitude_m = 3;
  // Height above the launch point, metres.
  double height_m = 4;
  // Along-track speed asked of guidance, metres per second.
  double cruise_mps = 5;
  // Overlap between neighbouring lines, a fraction in [0, 0.95].
  double sidelap = 6;
  // Across-track camera field of view, degrees.
  double across_track_fov_deg = 7;
  bool return_to_launch = 8;
  // Completion evidence: usable pictures each line needs; zero means one.
  uint32 min_usable_frames_per_line = 9;
  // Line bearing, degrees clockwise from true north. Absent follows the
  // area's longest edge. A team fixes it, so its members' lines align.
  optional double line_bearing_deg = 10;
  // The operator requires `height_m`: a revision that changes the height
  // changes the objective. Without it, the height is part of the plan, and
  // only the envelope's `max_height_m` bounds it.
  bool hold_height = 11;
}

// What the operator wants. A route is one way to satisfy it.
message MissionObjective {
  // A globally unique identifier (a time-ordered UUID, text form).
  string objective_id = 1;
  RecordOrigin origin = 2;
  // Append-only revision; the first is 1.
  uint64 revision = 3;
  // SHA-256 of the previous revision's encoding; empty for revision 1.
  bytes previous_digest = 4;
  string title = 5;
  oneof kind {
    SurveyObjective survey = 10;
  }
  // The team lane that made this objective from its own for one member;
  // the team owes the approval of the plan it compiles to. The host takes
  // it only from a session with the approver secret.
  string delegated_by = 11;
}

enum MissionTaskKind {
  MISSION_TASK_KIND_UNSPECIFIED = 0;
  // One survey line with its picture acquisition.
  MISSION_TASK_KIND_SURVEY_LINE = 1;
  // The way back over the launch point.
  MISSION_TASK_KIND_RETURN_HOME = 2;
}

// One bounded task of a plan.
message MissionTaskPlan {
  // The task's identity: opaque, unique in its proposal, and never derived
  // from its name or its position. Behaviour follows it.
  string task_id = 1;
  MissionTaskKind kind = 2;
  // The task's path, in fly order.
  repeated GeoPoint path = 3;
  double length_m = 4;
  // The lane that executes the task, for a team proposal; empty for a
  // vehicle's own proposal.
  string member = 5;
  // The task's name, for display only, such as "line-03".
  string name = 6;
}

message MissionEstimates {
  double path_length_m = 1;
  double duration_s = 2;
  // Zero when the vehicle states no energy model.
  double energy_wh = 3;
  uint32 lines = 4;
  double line_spacing_m = 5;
  double footprint_width_m = 6;
}

// What a proposal rests on. Admission checks them again.
message MissionAssumptions {
  // How the plan reaches the vehicle, such as `host-guided-velocity`.
  string execution_strategy = 1;
  string vehicle_name = 2;
  // The vehicle is a simulation, not a physical aircraft.
  bool simulated = 3;
  double max_horizontal_mps = 4;
  // The plan's content digest and revision in the mission core.
  bytes plan_digest = 5;
  string plan_revision = 6;
  // The usable energy and the reserve the estimate used; zero is unknown.
  double usable_energy_wh = 7;
}

// A member lane's proposal inside a team proposal.
message MemberProposal {
  string member = 1;
  // Not set; `record` carries the member's proposal.
  MissionProposal proposal = 2 [deprecated = true];
  // The member's proposal record, with the member's bytes unchanged.
  MissionProposalRecord record = 3;
}

// How a proposal record's body is encoded.
enum MissionProposalFormat {
  MISSION_PROPOSAL_FORMAT_UNSPECIFIED = 0;
  // The body is a `MissionProposal` with `digest` empty, encoded once by
  // the lane that compiled it.
  MISSION_PROPOSAL_FORMAT_V1 = 1;
}

// A proposal as immutable bytes (ADR-0014). Every receiver hashes the bytes
// it received and never a new encoding of the decoded message, so the
// digest that an approval binds names exactly these bytes. Two proposals
// with the same meaning can have different bytes and different digests.
message MissionProposalRecord {
  // A receiver refuses a format it does not know.
  MissionProposalFormat format = 1;
  bytes body = 2;
  // SHA-256 over the domain tag `pilotage.mission-proposal.v1` and a zero
  // byte, then `body`.
  bytes digest = 3;
}

// A compiled, grounded plan with its estimates. It grants nothing.
message MissionProposal {
  string proposal_id = 1;
  string objective_id = 2;
  // Empty in a record's body: the record carries the digest of the body.
  bytes digest = 3;
  repeated MissionTaskPlan tasks = 4;
  MissionEstimates estimates = 5;
  MissionAssumptions assumptions = 6;
  // For a team: the member proposals the team proposal binds.
  repeated MemberProposal members = 7;
  // The objective the proposal was compiled from.
  MissionObjective objective = 8;
  // The proposal this one succeeds; empty for a first plan.
  bytes predecessor_digest = 9;
  // What a successor changes, in words, for review.
  string summary = 10;
  // The execution features the plan uses, such as
  // `pilotage.task.survey-line/1`. An approver that does not know one of
  // them does not approve: it cannot review what it does not understand.
  repeated string requires = 11;
}

// The limits inside which a lane may adapt an approved plan without a new
// approval, and the permissions it holds.
message AdaptationEnvelope {
  // Highest height above the launch point, metres.
  double max_height_m = 1;
  // Least remaining battery fraction at which the plan must end.
  double min_reserve_fraction = 2;
  // Civil time after which the approval no longer admits anything.
  uint64 expires_unix_ms = 3;
  // The area adaptation may fly in; empty means the objective's area.
  repeated GeoPoint bound = 4;
  bool permit_execute = 5;
  bool permit_revise = 6;
  bool permit_allocate = 7;
  bool permit_change_objective = 8;
  // Survey lines a lane may fly again without a new approval.
  uint32 max_refly_lines = 9;
  // What a run does when the approval expires while it flies. A held or
  // expired run resumes only under a new approval of its plan.
  MissionExpiryPolicy on_expiry = 10;
}

// The recovery a run applies when its approval expires.
enum MissionExpiryPolicy {
  // The same as HOLD.
  MISSION_EXPIRY_POLICY_UNSPECIFIED = 0;
  // Stop in place and wait for a new approval.
  MISSION_EXPIRY_POLICY_HOLD = 1;
  // End after the line in progress and return to the launch point.
  MISSION_EXPIRY_POLICY_RETURN_HOME = 2;
}

// A permission bound to one proposal digest. The lane finds what the
// approval is for from the digest and the run: the plan before its start,
// a drafted successor, or a renewal of the plan in progress.
message MissionApproval {
  string approval_id = 1;
  bytes proposal_digest = 2;
  RecordOrigin approver = 3;
  AdaptationEnvelope envelope = 4;
  uint64 approved_unix_ms = 5;
  // The run the approval is for. Empty for a plan before its start. A
  // renewal of the plan in progress names its run, and a lane refuses it
  // for any other run, so an approval of one run never renews another run
  // of the same plan. An approval of a drafted successor names the run in
  // progress or nothing.
  string run_id = 6;
  // The format of the record whose digest the approval binds. A lane
  // refuses an approval that names no format, so a client that does not
  // know records gets a clear refusal.
  MissionProposalFormat proposal_format = 7;
  // The team lane that passed this approval down to a member, inside its
  // own approval; empty for an approval a person or a client gave. The
  // team owes the approvals of this lane that follow from it.
  string delegated_by = 8;
}

message MissionStart {
  bytes proposal_digest = 1;
}

message MissionHold {}

message MissionResume {}

message MissionAbort {}

// A planned change to an approved or running plan: a successor
// (ADR-0052). The lane compiles it into a draft that the receipt and the
// status show for review. An approval of the draft's digest admits it; a
// change inside the active approval's envelope is admitted at once when
// `within_envelope` is set. A running lane switches at its next
// checkpoint, the end of the task in progress, or at once while held. A
// lane never splices a running task.
message MissionRevise {
  // The proposal the change continues; the lane refuses a stale one.
  bytes base_digest = 1;
  // The run the change continues; empty before a start.
  string run_id = 2;
  // Admit at once when the change stays inside the active envelope.
  bool within_envelope = 3;
  // Who drafted the change; the host writes the admitted session.
  RecordOrigin drafted_by = 4;
  // Work the revision releases: a team asks it of a member before another
  // member gets the work. When the revision applies, the member's status
  // reports the release in `released`.
  WorkRelease release = 5;
  // The team lane whose revision this is a member's share of; that team
  // owes its approval when it granted the approval in force. The host
  // takes it only from a session with the approver secret.
  string share_of = 6;
  oneof change {
    // A new revision of the objective. A vehicle lane flies it from the
    // checkpoint; a team takes only a strip on its own line grid.
    MissionObjective objective = 10;
    // A team moves part of one member's unflown lines to another member.
    MissionReassign reassign = 11;
    // End after the task in progress and return to the launch point.
    MissionFinish finish = 12;
  }
}

// Part of one member's unflown survey lines, flown by another member.
message MissionReassign {
  string from_member = 1;
  string to_member = 2;
  // The fraction of the unflown lines that moves, in (0, 1]. The lines
  // move from the end of the band nearest the receiving member.
  double fraction = 3;
}

message MissionFinish {}

// The work a team asks a member to release: one assignment, in one
// generation.
message WorkRelease {
  // The assignment's identity; it includes the team's run, so a restarted
  // coordinator never reuses one.
  string assignment_id = 1;
  uint64 generation = 2;
}

// A member's report that a revision released work: the old run no longer
// flies the released tasks, and the lane refuses any intent for the plan
// that the revision replaced.
message WorkReleased {
  string assignment_id = 1;
  uint64 generation = 2;
  // The digest of the revision that released the work.
  bytes digest = 3;
  // The run that flies the revision.
  string run_id = 4;
  // The run the revision replaced.
  string superseded_run_id = 5;
  // The tasks of the replaced run that it did not begin; none of them is
  // flown by that run.
  repeated string task_ids = 6;
}

// Work that moves from one team member to another.
message MissionHandover {
  string assignment_id = 1;
  // The generation of the assignment now: the giving member's while the
  // release is open, one more once the work is committed to the receiving
  // member.
  uint64 generation = 2;
  string from_member = 3;
  string to_member = 4;
  MissionHandoverState state = 5;
  // The moved tasks, as the giving member names them.
  repeated string task_ids = 6;
  // What the commit rests on: the giving member's release, or a person's
  // statement that it is down. A statement is an override; it does not
  // prove that the member stopped or that its airspace is clear.
  string basis = 7;
}

enum MissionHandoverState {
  MISSION_HANDOVER_STATE_UNSPECIFIED = 0;
  // Waiting for the giving member's release. The work and its space stay
  // with the giving member, and the receiving member gets nothing.
  MISSION_HANDOVER_STATE_RELEASING = 1;
  // Committed to the receiving member.
  MISSION_HANDOVER_STATE_COMMITTED = 2;
  // The giving member refused, so it keeps the work.
  MISSION_HANDOVER_STATE_WITHDRAWN = 3;
  // Released by the giving member, and not taken by the receiving member:
  // nobody holds the work until an operator gives it to a member.
  MISSION_HANDOVER_STATE_UNASSIGNED = 4;
  // The coordinator restarted while the handover was open or committed. It
  // is not known whether a member flies the work; an operator checks both
  // members and gives the work to one.
  MISSION_HANDOVER_STATE_UNRECONCILED = 5;
  // The receiving member flew the moved lines to the end of its run.
  MISSION_HANDOVER_STATE_COMPLETED = 6;
  // A person checked the members and stated the handover resolved.
  MISSION_HANDOVER_STATE_RESOLVED = 7;
}

// A person states that a handover is resolved, after checking which member
// flies its work, if any. Only a session with the approver secret sends it.
// A team keeps an unreconciled handover, and refuses new work for its
// members, until one of these arrives; a new proposal resolves nothing.
message MissionResolveHandover {
  string assignment_id = 1;
  // Who stated it; the host writes the admitted session.
  RecordOrigin resolved_by = 2;
}

// A coordinator's handovers as it writes them to durable storage before it
// sends work to a member, so a restart does not lose them.
message MissionHandoverJournal {
  repeated MissionHandover handovers = 1;
}

message MissionSkip {
  string task_id = 1;
}

// A person states that a team member whose link is lost is down: it no
// longer flies. Until a member reports that it stopped or a person states
// this, its work and its line in progress stay reserved to it.
message MissionMemberDown {
  string member = 1;
  // Who stated it; the host writes the admitted session.
  RecordOrigin stated_by = 2;
}

// A request for the full proposal that `digest` names: the lane's plan or
// a drafted revision; empty names the lane's plan. The receipt carries it.
// A client approves only a proposal that it holds in full.
message MissionFetch {
  bytes digest = 1;
}

// A request from a principal to a lane. Every intent gets one receipt.
message MissionIntent {
  // Chosen by the sender; the receipt echoes it.
  string request_id = 1;
  oneof action {
    MissionObjective propose = 10;
    MissionApproval approve = 11;
    MissionStart start = 12;
    MissionHold hold = 13;
    MissionResume resume = 14;
    MissionAbort abort = 15;
    MissionSkip skip = 16;
    MissionRevise revise = 17;
    MissionMemberDown member_down = 18;
    MissionFetch fetch = 19;
    MissionResolveHandover resolve_handover = 20;
  }
}

enum MissionReceiptOutcome {
  MISSION_RECEIPT_OUTCOME_UNSPECIFIED = 0;
  MISSION_RECEIPT_OUTCOME_ACCEPTED = 1;
  MISSION_RECEIPT_OUTCOME_REFUSED = 2;
  // The lane asked for a transition it has not yet observed.
  MISSION_RECEIPT_OUTCOME_UNCERTAIN = 3;
}

message MissionReceipt {
  string request_id = 1;
  MissionReceiptOutcome outcome = 2;
  string reason = 3;
  // Not set; `proposal_record` carries the proposal.
  MissionProposal proposal = 4 [deprecated = true];
  string lane = 5;
  // The proposal a `propose` or `revise` intent compiled, or the one a
  // `fetch` intent names, as its record.
  MissionProposalRecord proposal_record = 6;
}

enum MissionLaneState {
  MISSION_LANE_STATE_UNSPECIFIED = 0;
  MISSION_LANE_STATE_IDLE = 1;
  MISSION_LANE_STATE_PROPOSED = 2;
  MISSION_LANE_STATE_ADMITTED = 3;
  MISSION_LANE_STATE_RUNNING = 4;
  MISSION_LANE_STATE_HELD = 5;
  MISSION_LANE_STATE_UNCERTAIN = 6;
  MISSION_LANE_STATE_COMPLETE = 7;
  MISSION_LANE_STATE_ABORTED = 8;
  MISSION_LANE_STATE_FAILED = 9;
  // A hold was accepted; the vehicle has not yet reported that it holds
  // in place.
  MISSION_LANE_STATE_HOLD_REQUESTED = 10;
}

// A task's state for display, derived from its execution and its
// judgment. A decision reads `execution`, `judgment` and the evidence
// `collection`, never this value.
enum MissionTaskState {
  MISSION_TASK_STATE_UNSPECIFIED = 0;
  MISSION_TASK_STATE_PENDING = 1;
  MISSION_TASK_STATE_ACTIVE = 2;
  MISSION_TASK_STATE_DONE = 3;
  // Begun or flown, without the completion the objective needs: flown
  // without enough evidence, or cut short by an abort.
  MISSION_TASK_STATE_INCOMPLETE = 4;
  MISSION_TASK_STATE_SKIPPED = 5;
}

// How a task's execution stands or ended. Only run events set it: evidence
// that arrives later never changes it.
enum MissionTaskExecution {
  MISSION_TASK_EXECUTION_UNSPECIFIED = 0;
  // Not begun.
  MISSION_TASK_EXECUTION_PENDING = 1;
  MISSION_TASK_EXECUTION_ACTIVE = 2;
  // The run finished the task.
  MISSION_TASK_EXECUTION_COMPLETED = 3;
  // An abort or a revision stopped the task after it began.
  MISSION_TASK_EXECUTION_CANCELLED = 4;
  // The run ended without finishing the task, such as by an unplanned
  // landing.
  MISSION_TASK_EXECUTION_FAILED = 5;
  // A revision replaced the task before it began.
  MISSION_TASK_EXECUTION_SKIPPED = 6;
}

// Whether the known evidence of a task meets what its objective needs. The
// task kind's rule gives it from the execution and the evidence.
enum MissionTaskJudgment {
  MISSION_TASK_JUDGMENT_UNSPECIFIED = 0;
  // Not known yet: the task has not ended, or its evidence is still open.
  MISSION_TASK_JUDGMENT_UNDETERMINED = 1;
  MISSION_TASK_JUDGMENT_MET = 2;
  MISSION_TASK_JUDGMENT_NOT_MET = 3;
}

// Whether a task can still get evidence.
enum MissionEvidenceCollection {
  MISSION_EVIDENCE_COLLECTION_UNSPECIFIED = 0;
  // The task still takes pictures, or a picture sent for a judgment has no
  // answer yet.
  MISSION_EVIDENCE_COLLECTION_OPEN = 1;
  // The task ended and every picture sent for a judgment has an answer, or
  // the task will take no pictures.
  MISSION_EVIDENCE_COLLECTION_SETTLED = 2;
  // The evidence window of the task closed while a picture sent for a
  // judgment had no answer. The judgment uses the answers that arrived.
  MISSION_EVIDENCE_COLLECTION_CLOSED = 3;
}

// What a task acquired and what the judgment service said about it.
message MissionTaskEvidence {
  // Pictures captured while the task was active.
  uint32 frames = 1;
  // Pictures a judgment service assessed.
  uint32 assessed = 2;
  // Assessed pictures judged usable for mapping.
  uint32 usable = 3;
  // Assessed pictures that showed a possible hazard.
  uint32 hazards = 4;
  string note = 5;
  // The evidence as one value, for display.
  MissionEvidenceState state = 6;
  MissionEvidenceCollection collection = 7;
  // Answers that arrived after the evidence window closed. They are
  // counted here only; they change no other field.
  uint32 late = 8;
}

// Where a task's completion evidence stands, as one value for display.
enum MissionEvidenceState {
  MISSION_EVIDENCE_STATE_UNSPECIFIED = 0;
  // Pictures sent for a judgment have no answer yet.
  MISSION_EVIDENCE_STATE_PENDING = 1;
  // Enough pictures were judged usable.
  MISSION_EVIDENCE_STATE_MET = 2;
  // Every judgment is in, and too few pictures were judged usable.
  MISSION_EVIDENCE_STATE_MISSING = 3;
  // No judgment service judged the task's pictures.
  MISSION_EVIDENCE_STATE_NOT_JUDGED = 4;
}

message MissionTaskStatus {
  string task_id = 1;
  MissionTaskKind kind = 2;
  MissionTaskState state = 3;
  MissionTaskEvidence evidence = 4;
  // Fraction of the task's path flown, [0, 1].
  double progress = 5;
  // The member lane that holds the task, for a team.
  string member = 6;
  // Times the task was flown again.
  uint32 reflown = 7;
  // The task's path, so any client draws the task without the proposal.
  repeated GeoPoint path = 8;
  // The task's name, for display only.
  string name = 9;
  MissionTaskExecution execution = 10;
  MissionTaskJudgment judgment = 11;
}

// One lane's state, published on the reliable stream when it changes and
// at a slow steady rate.
message MissionStatus {
  string lane = 1;
  MissionLaneState state = 2;
  string objective_id = 3;
  bytes proposal_digest = 4;
  bytes plan_digest = 5;
  string run_id = 6;
  repeated MissionTaskStatus tasks = 7;
  // The name of the task in progress, for display.
  string active_task = 8;
  // The recovery the lane applies when it cannot continue.
  string recovery_policy = 9;
  MissionEstimates estimates = 10;
  bool simulated = 11;
  string detail = 12;
  // A team lane's member lanes, as their own statuses.
  repeated MissionStatus members = 13;
  // Increases with every published change.
  uint64 sequence = 14;
  // The objective's area, for display.
  repeated GeoPoint area = 15;
  // The objective's height above the launch point, metres, for display;
  // zero when it states none. An approval is sized from the full proposal.
  double height_m = 16;
  // A successor drafted, admitted or applied to the plan in progress.
  MissionSuccessor successor = 17;
  // On a team's member entry: how the team sees the member's link and
  // whether the member's work is still its own. A client acts on this,
  // never on `detail`, which is for display only.
  MemberLink member_link = 18;
  // How a vehicle's run executes now; absent without a run.
  MissionExecution execution = 19;
  // The run this run continues, when a revision replaced it; empty for a
  // run of a first plan.
  string predecessor_run_id = 20;
  // Why the run holds or is asked to hold; empty when it does not. A team
  // lists every reason of its members that may still fly.
  repeated MissionHoldReason holds = 21;
  // Work this lane's revisions released, for the team that asked.
  repeated WorkReleased released = 22;
  // A team's work moving between its members.
  repeated MissionHandover handovers = 23;
  // The approvals the lane needs now. A client raises one for a person
  // only when no other lane owes it.
  repeated MissionApprovalNeed approvals_needed = 24;
}

// What an approval is for.
enum MissionApprovalTarget {
  MISSION_APPROVAL_TARGET_UNSPECIFIED = 0;
  // The plan, before its start.
  MISSION_APPROVAL_TARGET_PLAN = 1;
  // A drafted successor of the plan in progress.
  MISSION_APPROVAL_TARGET_SUCCESSOR = 2;
  // The plan in progress, whose approval expired.
  MISSION_APPROVAL_TARGET_RENEWAL = 3;
}

// One approval a lane needs.
message MissionApprovalNeed {
  MissionApprovalTarget target = 1;
  // The digest the approval binds.
  bytes digest = 2;
  // The run the approval names; empty for a plan.
  string run_id = 3;
  // The team lane that owes the approval: the team that passed down the
  // approval in force, for its own share of a revision or the renewal of
  // what it granted. Empty when any approver may give it.
  string owed_by_lane = 4;
  // Why the approval is needed, for display.
  string reason = 5;
}

// One reason a run holds. A renewal of the approval removes only
// APPROVAL_EXPIRED, and an operator's resume removes only OPERATOR; the run
// resumes when no reason stays. A fault, a motion lease held elsewhere or an
// unknown member state is no hold reason, and neither removes it.
enum MissionHoldReason {
  MISSION_HOLD_REASON_UNSPECIFIED = 0;
  // An operator asked the run to hold.
  MISSION_HOLD_REASON_OPERATOR = 1;
  // The approval expired, and its recovery holds the run.
  MISSION_HOLD_REASON_APPROVAL_EXPIRED = 2;
}

// How a team sees one member.
enum MemberLink {
  MEMBER_LINK_UNSPECIFIED = 0;
  // The member reports.
  MEMBER_LINK_REPORTING = 1;
  // The link is lost and the member's state is unknown: it may still fly,
  // so its work and its line in progress stay reserved to it.
  MEMBER_LINK_LOST = 2;
  // A person stated that the member is down: its work may move.
  MEMBER_LINK_DOWN = 3;
  // The member is down and its work moved to other members.
  MEMBER_LINK_RELEASED = 4;
}

// What a vehicle's run does now, beside the lane's state.
message MissionExecution {
  MissionExecutionState state = 1;
  // The principal that holds the motion lease the run waits for, when the
  // run knows it.
  uint64 lease_holder = 2;
}

enum MissionExecutionState {
  MISSION_EXECUTION_STATE_UNSPECIFIED = 0;
  // The run flies its plan.
  MISSION_EXECUTION_STATE_FLYING = 1;
  // A real vehicle's run waits for its pilot to launch it.
  MISSION_EXECUTION_STATE_AWAITING_LAUNCH = 2;
  // Another principal holds the motion lease; the run waits to get it back.
  MISSION_EXECUTION_STATE_LEASE_HELD_ELSEWHERE = 3;
  // The run holds the vehicle in place.
  MISSION_EXECUTION_STATE_HOLDING = 4;
  // The run stopped and released the vehicle.
  MISSION_EXECUTION_STATE_STOPPED = 5;
  // Every run of a team ended, and the team waits for the evidence of its
  // tasks before it judges them and decides whether to fly a task again.
  MISSION_EXECUTION_STATE_AWAITING_RESULTS = 6;
}

enum MissionSuccessorState {
  MISSION_SUCCESSOR_STATE_UNSPECIFIED = 0;
  // Waiting for review: an approval of its digest admits it.
  MISSION_SUCCESSOR_STATE_DRAFTED = 1;
  // Admitted; the lane switches at its next checkpoint.
  MISSION_SUCCESSOR_STATE_ADMITTED = 2;
  // The lane flies it.
  MISSION_SUCCESSOR_STATE_APPLIED = 3;
  // A member refused its share, so the revision does not apply.
  MISSION_SUCCESSOR_STATE_WITHDRAWN = 4;
}

// A successor as a lane's status reports it.
message MissionSuccessor {
  bytes digest = 1;
  // What it changes, in words.
  string summary = 2;
  MissionSuccessorState state = 3;
  // The checkpoint it waits for, such as the task in progress.
  string applies_after = 4;
  // The session that drafted it.
  string drafted_by = 5;
}
