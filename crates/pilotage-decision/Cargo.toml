[package]
name = "pilotage-decision"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The decision port: typed judgments over a state and images, from any System One compatible service"

[lints]
workspace = true

[features]
default = []
# A blocking HTTP client for the port. Leave it off where the caller owns I/O.
http = ["dep:ureq"]

[dependencies]
base64 = "0.22.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "0.1.24"
ureq = { version = "2.12.1", default-features = false, features = ["tls"], optional = true }
