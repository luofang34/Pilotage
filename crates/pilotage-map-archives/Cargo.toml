[package]
name = "pilotage-map-archives"
version = "0.1.0"
edition.workspace = true
description = "File-backed map tile sources for installed aviation packages"
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1"
pmtiles = { version = "0.24", default-features = false, features = ["http-async"] }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "fs", "io-util"] }

[dev-dependencies]
pmtiles = { version = "0.24", default-features = false, features = ["write"] }
tempfile = "3.23"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
