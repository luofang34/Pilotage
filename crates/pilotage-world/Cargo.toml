[package]
name = "pilotage-world"
description = "One simulated world for every simulator: sites, terrain elevation, and the magnetic field"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["archive"]
# Terrain from a Terrarium MBTiles archive through pilotage-terrain-query.
# It needs std and SQLite, so a wasm or bare-metal build leaves it off.
archive = ["std", "dep:pilotage-terrain-query"]
std = []

[dependencies]
# The geomagnetic model is the shared world model's WMM2025 evaluator
# (luofang34/world), pinned to one exact revision so every simulator and
# flight controller that uses it sees the same field. Both crates of that
# workspace must always pin the identical rev.
world-core = { git = "https://github.com/luofang34/world.git", rev = "ddb686df03aa5ec84c394895021ac3305f60f49f" }
world-geomag = { git = "https://github.com/luofang34/world.git", rev = "ddb686df03aa5ec84c394895021ac3305f60f49f" }
libm = { workspace = true }
pilotage-geo = { workspace = true }
pilotage-terrain-query = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
png = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3.23.0"
