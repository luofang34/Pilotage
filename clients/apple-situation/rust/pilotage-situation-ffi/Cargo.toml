[package]
name = "pilotage-situation-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "UniFFI facade for Pilotage traffic and weather on iOS"
license = "MIT"
repository = "https://github.com/luofang34/Pilotage"
publish = false

[workspace]

[workspace.dependencies]
aero-link = { path = "../../.build/aero-link", default-features = false }
airmass-core = { path = ".build/airmass/crates/airmass-core", default-features = false }
libm = "0.2"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
surveillance-core = { path = ".build/surveillance/crates/surveillance-core", default-features = false }
thiserror = { version = "2.0", default-features = false }

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "pilotage-situation-uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
aero-link = { path = "../../.build/aero-link", features = ["std"] }
airmass-aero-link = { path = ".build/airmass/crates/airmass-aero-link", features = ["std"] }
airmass-core = { path = ".build/airmass/crates/airmass-core", features = ["std"] }
airmass-geojson = { path = ".build/airmass/crates/airmass-geojson" }
pilotage-navdata-cycle = { path = "../../../../crates/pilotage-navdata-cycle" }
pilotage-presentation = { path = "../../../../crates/pilotage-presentation" }
pilotage-terrain-query = { path = "../../../../crates/pilotage-terrain-query" }
serde_json = "1.0"
surveillance-aero-link = { path = ".build/surveillance/crates/surveillance-aero-link", features = ["std"] }
surveillance-core = { path = ".build/surveillance/crates/surveillance-core", features = ["std"] }
surveillance-geojson = { path = ".build/surveillance/crates/surveillance-geojson" }
thiserror = "2.0"
uniffi = { version = "0.32", features = ["cli"] }

[patch."https://github.com/luofang34/Airmass.git"]
airmass-core = { path = ".build/airmass/crates/airmass-core" }
airmass-geojson = { path = ".build/airmass/crates/airmass-geojson" }

[patch."https://github.com/luofang34/Surveillance.git"]
surveillance-core = { path = ".build/surveillance/crates/surveillance-core" }
surveillance-geojson = { path = ".build/surveillance/crates/surveillance-geojson" }

[dev-dependencies]
png = "0.18.1"
rusqlite = { version = "0.40.2", default-features = false }
tempfile = "3.23.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"

[lints]
workspace = true
