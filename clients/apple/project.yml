name: Pilotage
options:
  bundleIdPrefix: org.luofang.pilotage
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    AERO_LINK_DRIVER_BUNDLE_IDENTIFIER: ${AERO_LINK_DRIVER_BUNDLE_IDENTIFIER}
    AERO_LINK_HOST_BUNDLE_IDENTIFIER: ${AERO_LINK_HOST_BUNDLE_IDENTIFIER}
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
packages:
  PilotageAppleInstrumentConsumer:
    path: ../apple-instrument-consumer
  PilotageCore:
    path: Packages/PilotageCore
  PilotageMapLibreBinding:
    path: Packages/PilotageMapLibreBinding
  PilotageRadioSource:
    path: Packages/PilotageRadioSource
projectReferences:
  AeroLink:
    path: .build/aero-link/platforms/apple/AeroLink.xcodeproj
targets:
  Pilotage:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Pilotage.entitlements
      - path: Resources
        excludes:
          - Fonts
      - path: .build/GlobeResources
      - path: .build/AviationDataExamples
        type: folder
      # A folder reference, so the fontstack directory survives into the bundle. Flattened
      # the way other resources are, the renderer asks for a path that is not there.
      - path: Resources/Fonts
        type: folder
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Pilotage.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(AERO_LINK_HOST_BUNDLE_IDENTIFIER)
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ${PILOTAGE_MAPLIBRE_SWIFT_CONDITIONS}"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/GlobeBridge.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/.build/maplibre-globe/include"
    dependencies:
      - package: PilotageAppleInstrumentConsumer
        product: PilotageAppleInstrumentConsumer
      - package: PilotageCore
        product: PilotageCore
      - package: PilotageMapLibreBinding
        product: PilotageMapLibreBinding
      - package: PilotageRadioSource
        product: PilotageRadioSource
      - target: AeroLink/AeroLinkAppleClient
        embed: true
      - target: AeroLink/AeroLinkDriver
        embed: true
      - sdk: SystemExtensions.framework
      - framework: .build/MapLibreGlobe.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: libc++.tbd
  PilotageMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GlobeSituationOverlayTests.swift
    dependencies:
      - target: Pilotage
      - package: PilotageCore
        product: PilotageCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pilotage.app/Pilotage"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pilotage:
    build:
      targets:
        Pilotage: all
    run:
      config: Debug
    test:
      targets:
        - PilotageMapTests
    archive:
      config: Release
