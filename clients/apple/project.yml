name: Pilotage
options:
  bundleIdPrefix: org.luofang.pilotage
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    AERO_LINK_DRIVER_BUNDLE_IDENTIFIER: ${AERO_LINK_DRIVER_BUNDLE_IDENTIFIER}
    AERO_LINK_HOST_BUNDLE_IDENTIFIER: ${AERO_LINK_HOST_BUNDLE_IDENTIFIER}
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
packages:
  PilotageCore:
    path: Packages/PilotageCore
  PilotageMapLibreBinding:
    path: Packages/PilotageMapLibreBinding
  PilotageRadioSource:
    path: Packages/PilotageRadioSource
projectReferences:
  AeroLink:
    path: .build/aero-link/platforms/apple/AeroLink.xcodeproj
targets:
  Pilotage:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Pilotage.entitlements
      - path: Resources
        excludes:
          - Fonts
      # A folder reference, so the fontstack directory survives into the bundle. Flattened
      # the way other resources are, the renderer asks for a path that is not there.
      - path: Resources/Fonts
        type: folder
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Pilotage.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(AERO_LINK_HOST_BUNDLE_IDENTIFIER)
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ${PILOTAGE_MAPLIBRE_SWIFT_CONDITIONS}"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: PilotageCore
        product: PilotageCore
      - package: PilotageMapLibreBinding
        product: PilotageMapLibreBinding
      - package: PilotageRadioSource
        product: PilotageRadioSource
      - target: AeroLink/AeroLinkAppleClient
        embed: true
      - target: AeroLink/AeroLinkDriver
        embed: true
      - sdk: SystemExtensions.framework
schemes:
  Pilotage:
    build:
      targets:
        Pilotage: all
    run:
      config: Debug
    archive:
      config: Release
